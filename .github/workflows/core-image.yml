name: Core Image

# Fork only: builds the Core image (with domain management) and pushes it to GHCR,
# so hosts without Docker Hub access can pull it directly.
on:
  push:
    branches: [feat/domains-v2]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  core:
    if: github.repository_owner != 'moghtech'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/komodo-core
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bin/core/aio.Dockerfile
          platforms: linux/amd64
          build-args: |
            VERSION=2.3.3
            IMAGE_TAG=domains
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
